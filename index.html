<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Eclipse de Aethelgard - Ficha de Personaje</title>
    <style>
        :root {
            --blood: #812a20;
            --ember: #c1502e;
            --iron: #6b7480;
            --astral: #b89a4f;
            --sanguine: #556b2f;
            --umbra: #4a3b6b;
            --bg-dark: #0f0f12;
            --panel-bg: #1a1a20;
            --border-color: #3a3a45;
        }

        body {
            font-family: 'Cinzel', 'Georgia', serif;
            background-color: var(--bg-dark);
            color: #dcdcdc;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 2px solid var(--astral);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        h1, h2, h3 {
            color: var(--astral);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
        }

        .section {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (max-width: 600px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #b0b0b0;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: #0d0d10;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* BOTONES DE RAZA CORREGIDOS: type="button" IMPIDE REINICIO */
        .race-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
        }

        .btn-race {
            padding: 8px;
            background: #252530;
            color: #ccc;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-race:hover, .btn-race.active {
            background: var(--ember);
            color: #fff;
            border-color: var(--astral);
        }

        .stat-box {
            text-align: center;
            background: #111116;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .stat-box input {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--blood);
            color: white;
            border: 1px solid var(--astral);
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: var(--ember);
        }

        .status-banner {
            margin-top: 15px;
            padding: 10px;
            background: #2e7d32;
            color: white;
            text-align: center;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>El Eclipse de Aethelgard</h1>
    
    <form id="sheetForm">
        <!-- SECCIÓN BÁSICA -->
        <div class="section">
            <h2>Datos del Personaje</h2>
            <div class="grid-2">
                <div class="form-group">
                    <label for="charName">Nombre del Personaje</label>
                    <input type="text" id="charName" required>
                </div>
                <div class="form-group">
                    <label for="charClass">Clase</label>
                    <select id="charClass">
                        <option value="Guerrero">Guerrero</option>
                        <option value="Mago">Mago</option>
                        <option value="Pícaro">Pícaro</option>
                        <option value="Clérigo">Clérigo</option>
                        <option value="Paladín">Paladín</option>
                        <option value="Explorador">Explorador</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Raza (Haz clic para seleccionar):</label>
                <input type="hidden" id="selectedRace" value="Humano">
                <div class="race-grid">
                    <!-- Todos llevan type="button" para NO enviar ni reiniciar la página -->
                    <button type="button" class="btn-race active" onclick="setRace(this, 'Humano')">Humano</button>
                    <button type="button" class="btn-race" onclick="setRace(this, 'Elfo')">Elfo</button>
                    <button type="button" class="btn-race" onclick="setRace(this, 'Enano')">Enano</button>
                    <button type="button" class="btn-race" onclick="setRace(this, 'Orco')">Orco</button>
                    <button type="button" class="btn-race" onclick="setRace(this, 'Tiefling')">Tiefling</button>
                    <button type="button" class="btn-race" onclick="setRace(this, 'Gnomo')">Gnomo</button>
                </div>
            </div>
        </div>

        <!-- ATRIBUTOS -->
        <div class="section">
            <h2>Atributos Principales</h2>
            <div class="grid-3">
                <div class="stat-box">
                    <label for="str">Fuerza</label>
                    <input type="number" id="str" value="10">
                </div>
                <div class="stat-box">
                    <label for="dex">Destreza</label>
                    <input type="number" id="dex" value="10">
                </div>
                <div class="stat-box">
                    <label for="con">Constitución</label>
                    <input type="number" id="con" value="10">
                </div>
                <div class="stat-box">
                    <label for="int">Inteligencia</label>
                    <input type="number" id="int" value="10">
                </div>
                <div class="stat-box">
                    <label for="wis">Sabiduría</label>
                    <input type="number" id="wis" value="10">
                </div>
                <div class="stat-box">
                    <label for="cha">Carisma</label>
                    <input type="number" id="cha" value="10">
                </div>
            </div>
        </div>
        <!-- DETALLES Y NOTAS -->
        <div class="section">
            <h2>Habilidades e Inventario</h2>
            <div class="form-group">
                <label for="equipment">Equipo e Inventario</label>
                <textarea id="equipment" rows="3" placeholder="Espada corta, armadura de cuero..."></textarea>
            </div>
            <div class="form-group">
                <label for="notes">Notas / Trasfondo</label>
                <textarea id="notes" rows="3" placeholder="Historia del personaje..."></textarea>
            </div>
        </div>

        <button type="submit" class="btn-submit">Guardar Ficha Directamente</button>
    </form>

    <div id="statusMsg" class="status-banner">¡Ficha actualizada y aprobada correctamente!</div>
</div>

<script>
    const raceInput = document.getElementById('selectedRace');
    const form = document.getElementById('sheetForm');
    const statusMsg = document.getElementById('statusMsg');

    // Asignar raza sin recargar ni borrar nada
    function setRace(btn, race) {
        document.querySelectorAll('.btn-race').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        raceInput.value = race;
    }

    // Guardado directo sin restricciones de Game Master ni estado Pendiente
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const data = {
            name: document.getElementById('charName').value,
            class: document.getElementById('charClass').value,
            race: raceInput.value,
            stats: {
                str: document.getElementById('str').value,
                dex: document.getElementById('dex').value,
                con: document.getElementById('con').value,
                int: document.getElementById('int').value,
                wis: document.getElementById('wis').value,
                cha: document.getElementById('cha').value
            },
            equipment: document.getElementById('equipment').value,
            notes: document.getElementById('notes').value,
            status: 'Aprobado' // Aprobado directo sin requerir autorización
        };

        localStorage.setItem('aethelgard_sheet', JSON.stringify(data));

        statusMsg.style.display = 'block';
        setTimeout(() => {
            statusMsg.style.display = 'none';
        }, 3000);
    });

    // Cargar datos al abrir
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('aethelgard_sheet');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('charName').value = data.name || '';
            document.getElementById('charClass').value = data.class || 'Guerrero';
            document.getElementById('equipment').value = data.equipment || '';
            document.getElementById('notes').value = data.notes || '';

            if (data.stats) {
                document.getElementById('str').value = data.stats.str || 10;
                document.getElementById('dex').value = data.stats.dex || 10;
                document.getElementById('con').value = data.stats.con || 10;
                document.getElementById('int').value = data.stats.int || 10;
                document.getElementById('wis').value = data.stats.wis || 10;
                document.getElementById('cha').value = data.stats.cha || 10;
            }

            if (data.race) {
                raceInput.value = data.race;
                document.querySelectorAll('.btn-race').forEach(btn => {
                    if (btn.textContent.trim() === data.race) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
        }
    });
</script>

</body>
</html>
